name: CI

# v38.3 — Gate de calidad en cada PR y push a main.
# El build de producción (con prisma migrate deploy) lo hace Vercel;
# aquí se valida con un DATABASE_URL ficticio (el build no toca la BD:
# el hub /lloguer y el sitemap degradan con gracia si no hay BD).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instal·la dependències
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Guardia de repo + drift del dispatcher (build falla si una ruta _impl no està registrada)
        run: node scripts/check_repo.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # F4 — Suite bloquejant: un procés bun PER FITXER. Els mock.module globals
      # (p. ex. audit_v23 sobre @/lib/security) poden re-vincular mòduls que
      # unit.test.ts comprova REALS segons l'ordre no determinista de bun quan
      # tots els fitxers corren al mateix procés; aïllar cada fitxer al seu
      # propi procés fa el resultat determinista i cap mock no pot travar
      # a cap altre fitxer. `set -e`: el primer fallo bloca (cap excepció).
      - name: Tests unitaris i d'integració (bloquejants — un procés per fitxer)
        run: |
          set -e
          for f in unit totp pdf_report audit_v23 reports_shop rental_share analisi analitza funcionalitats f4_qa email_first consulta_v47 form_contract_v48; do
            echo "##[group]tests/$f.test.ts"
            bun test "tests/$f.test.ts"
            echo "##[endgroup]"
          done

      - name: Auditoria de dependències de producció (high+ bloqueja)
        run: npm run audit

      - name: "Build de producció (sense migracions: les aplica Vercel)"
        run: npx prisma generate && npx next build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
