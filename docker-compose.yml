# ============================================================================
# PreuReal.cat — orquestación de producción (PostgreSQL incluido)
#
#   docker compose build          # construir las imágenes
#   docker compose up -d          # arrancar (postgres → dbinit → app → caddy)
#   docker compose logs -f app    # ver logs de la app
#   docker compose ps             # estado
#
# Actualizar datos oficiales (Incasòl/DOGC):
#   docker compose run --rm dbinit bash scripts/update_all.sh
#
# Migrar el archivo SQLite original a este PostgreSQL:
#   (histórico SQLite→PG: ya aplicado; script en scripts/archive/migrate_sqlite_to_pg.py)
#
# Requisito: .env junto a este archivo (copia .env.production.example → .env).
# DATABASE_URL ya no hace falta en el .env para VPS: se compone abajo.
# ============================================================================
name: preureal

services:
  # --- 0. PostgreSQL persistente --------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: preureal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canvia_aquesta_clau}
      POSTGRES_DB: preureal
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preureal -d preureal"]
      interval: 5s
      timeout: 3s
      retries: 12

  # --- 1. inicialización de la BD (migraciones versionadas + seed) ----------
  # También se usa como caja de herramientas para actualizar datos oficiales.
  dbinit:
    build:
      context: .
      target: build
    image: preureal/tools:latest
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://preureal:${POSTGRES_PASSWORD:-canvia_aquesta_clau}@postgres:5432/preureal
    command: >
      sh -c "bunx prisma migrate deploy
      && (bun run scripts/seed.ts || echo '⚠ seed falló (¿ICGC no disponible?) —
      la app arranca igual; reintenta después con update_all.sh')"
    depends_on:
      postgres:
        condition: service_healthy

  # --- 2. aplicación ---------------------------------------------------------
  app:
    build:
      context: .
      target: runtime
    image: preureal/app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # la BD vive SIEMPRE en el servicio postgres, se ignora la ruta del .env
      DATABASE_URL: postgresql://preureal:${POSTGRES_PASSWORD:-canvia_aquesta_clau}@postgres:5432/preureal
    expose:
      - "3000"
    depends_on:
      dbinit:
        condition: service_completed_successfully

  # --- 3. reverse proxy con HTTPS automático (Let's Encrypt) -----------------
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:-preureal.cat}
    volumes:
      - ./deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificados TLS
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pg_data:
  caddy_data:
  caddy_config:
